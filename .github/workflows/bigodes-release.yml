name: BIGODES one-time validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bigodes-release.yml']
permissions:
  contents: write
concurrency:
  group: bigodes-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate scoped identity changes and compile
        shell: bash
        run: |
          python3 <<'PY'
          import subprocess,textwrap,json
          previous=subprocess.check_output(['git','show','084e99cf1d5036a95ccb8c89e9222966acf01d8b:.github/workflows/bigodes-release.yml'],text=True)
          driver=textwrap.dedent(previous.split('        run: |\n',1)[1])
          driver=driver.split("python3 <<'PY'\n",1)[1].rsplit('\nPY',1)[0]
          prefix=driver.split('tasks=[',1)[0]
          exec(prefix)
          subprocess.run(['bash','-euo','pipefail','-c','mkdir -p /tmp/bigodes-baseline && git archive 358c142c48612ed322bd875947169a3f673ba31e^ | tar -x -C /tmp/bigodes-baseline'],check=True)
          subprocess.run(['bash','-euo','pipefail','-c',apply],check=True)
          subprocess.run(['bash','-euo','pipefail','-c',script('Add branding regression tests')],check=True)
          p='production/tests/bigodds.test.mjs'
          with open(p) as f:s=f.read()
          old="assert.equal(node('#pageTitle').textContent,'Histórico')"
          assert s.count(old)==1
          with open(p,'w') as f:f.write(s.replace(old,"assert.equal(node('#pageTitle').innerHTML,'Histórico')"))
          subprocess.run(['npm','ci'],check=True)
          failures={}
          summaries={}
          for label,cwd in [('baseline','/tmp/bigodes-baseline'),('candidate','.')]:
              failures[label]=[];summaries[label]={}
              for suite in ['tests/*.test.mjs','production/tests/*.test.mjs']:
                  r=subprocess.run(['bash','-c','node --test --test-reporter=tap '+suite],cwd=cwd,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
                  key='legacy' if suite.startswith('tests/') else 'production'
                  with open('/tmp/bigodes-'+label+'-'+key+'.txt','w') as f:f.write(r.stdout)
                  failures[label]+=[line.split(' - ',1)[-1] for line in r.stdout.splitlines() if line.startswith('not ok ')]
                  summaries[label][key]=[line for line in r.stdout.splitlines() if line.startswith(('# tests ','# pass ','# fail '))]
                  print(label,key,*summaries[label][key],flush=True)
          assert sorted(failures['candidate'])==sorted(failures['baseline']),(failures['baseline'],failures['candidate'])
          subprocess.run(['node','--test','production/tests/bigodes-brand.test.mjs'],check=True)
          result={'baseline':summaries['baseline'],'candidate':summaries['candidate'],'preexistingFailures':failures['baseline'],'newFailures':[]}
          with open('docs/evidence/bigodes/test-comparison.json','w') as f:json.dump(result,f,ensure_ascii=False,indent=2)
          with open('/tmp/bigodes-tests.txt','w') as f:json.dump(result,f,ensure_ascii=False,indent=2)
          subprocess.run(['bash','-euo','pipefail','-c',script('Check candidate syntax and compile without deployment')],check=True)
          commit=script('Commit verified source and remove this one-time runner').replace('git diff --cached --stat','git add production/tests/bigodds.test.mjs\ngit diff --cached --stat')
          subprocess.run(['bash','-euo','pipefail','-c',commit],check=True)
          PY
