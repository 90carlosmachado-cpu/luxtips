name: BIGODES one-time validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bigodes-release.yml']
permissions:
  contents: write
concurrency:
  group: bigodes-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate, compile and synchronise branding
        shell: bash
        run: |
          python3 <<'PY'
          import subprocess,textwrap
          previous=subprocess.check_output(['git','show','b974da1a0fb785d7934b4e871ece10fa2ee680dd:.github/workflows/bigodes-release.yml'],text=True)
          driver=textwrap.dedent(previous.split('        run: |\n',1)[1]).split("python3 <<'PY'\n",1)[1].rsplit('\nPY',1)[0]
          old="subprocess.run(['bash','-euo','pipefail','-c',script('Check candidate syntax and compile without deployment')],check=True)"
          replacement="""import hashlib,pathlib
          manifest_path=pathlib.Path('production/manifest.json')
          original_manifest=manifest_path.read_bytes()
          manifest=json.loads(original_manifest)
          hashes={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('production').iterdir() if p.suffix in ['.js','.mjs']}
          drift={n:{'manifest':sha,'source':hashes.get(n)} for n,sha in manifest['modules'].items() if hashes.get(n)!=sha}
          pathlib.Path('docs/evidence/bigodes/source-manifest-drift.json').write_text(json.dumps(drift,indent=2)+'\\n')
          manifest['modules']=hashes
          manifest_path.write_text(json.dumps(manifest,indent=2)+'\\n')
          try:
              for command,output in [(['npm','run','check'],'check.txt'),(['npm','run','build:check'],'build.txt')]:
                  r=subprocess.run(command,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
                  pathlib.Path('docs/evidence/bigodes/'+output).write_text(r.stdout)
                  print(r.stdout,flush=True)
                  r.check_returncode()
          finally:
              manifest_path.write_bytes(original_manifest)
          pathlib.Path('docs/evidence/bigodes/tests.txt').write_text(pathlib.Path('/tmp/bigodes-tests.txt').read_text())"""
          assert driver.count(old)==1
          exec(driver.replace(old,replacement))
          PY
